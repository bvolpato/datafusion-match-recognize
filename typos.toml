[default.extend-words]
# SQL:2016 pattern variable names used in tests and examples
strt = "strt"
dups = "dups"
# DataFusion abbreviation for AggregateUDF
udaf = "udaf"
udafs = "udafs"
# Short local variable name for PhysicalNavKind
pn = "pn"
# sqllogictest column-type descriptor (Integer, Integer, Text)
IIT = "IIT"
IIIT = "IIIT"
IIIIT = "IIIIT"
IIIIIT = "IIIIIT"
IITT = "IITT"
TITTIII = "TITTIII"

[files]
extend-exclude = [
    "*.lock",
    "proptest-regressions/",
]
