syntax = "proto3";

package datafusion_match_recognize.v1;

message SymbolRefProto {
  oneof kind {
    string named = 1;
    bool start = 2;
    bool end = 3;
  }
}

message PatternProto {
  oneof kind {
    SymbolRefProto symbol = 1;
    PatternProto exclude = 2;
    PatternListProto permute = 3;
    PatternListProto concat = 4;
    PatternListProto alternation = 5;
    RepetitionProto repetition = 6;
  }
}

message PatternListProto {
  repeated PatternProto items = 1;
}

message RepetitionProto {
  PatternProto inner = 1;
  uint32 min = 2;
  optional uint32 max = 3;
  bool reluctant = 4;
}

enum RowsPerMatchProto {
  ROWS_PER_MATCH_ONE_ROW = 0;
  ROWS_PER_MATCH_ALL_ROWS_SHOW_EMPTY = 1;
  ROWS_PER_MATCH_ALL_ROWS_OMIT_EMPTY = 2;
  ROWS_PER_MATCH_ALL_ROWS_WITH_UNMATCHED = 3;
}

message AfterMatchSkipProto {
  oneof kind {
    bool past_last_row = 1;
    bool to_next_row = 2;
    string to_first = 3;
    string to_last = 4;
  }
}

enum LogicalNavKindProto {
  LOGICAL_NAV_FIRST = 0;
  LOGICAL_NAV_LAST = 1;
}

enum PhysicalNavKindProto {
  PHYSICAL_NAV_PREV = 0;
  PHYSICAL_NAV_NEXT = 1;
}

enum AggKindProto {
  AGG_COUNT_STAR = 0;
  AGG_COUNT_SYMBOL = 1;
  AGG_COUNT = 2;
  AGG_SUM = 3;
  AGG_AVG = 4;
  AGG_MIN = 5;
  AGG_MAX = 6;
  AGG_UDAF = 7;
}

enum EvalSemanticsProto {
  EVAL_SEMANTICS_RUNNING = 0;
  EVAL_SEMANTICS_FINAL = 1;
}

message MeasureSlotProto {
  string slot_name = 1;
  EvalSemanticsProto semantics = 2;
  oneof kind {
    bool match_number = 3;
    ClassifierSlotProto classifier = 4;
    NavSlotProto nav = 5;
    AggSlotProto agg = 6;
    CurrentRowSlotProto current_row = 7;
  }
}

message ClassifierSlotProto {
  optional string symbol = 1;
  optional LogicalNavKindProto logical_nav = 2;
  uint32 logical_offset = 3;
  optional PhysicalNavKindProto physical_nav = 4;
  uint32 physical_offset = 5;
}

message NavSlotProto {
  optional LogicalNavKindProto logical_nav = 1;
  uint32 logical_offset = 2;
  optional PhysicalNavKindProto physical_nav = 3;
  uint32 physical_offset = 4;
  optional string symbol = 5;
  bytes inner_expr = 6;
  bool uses_match_metadata = 7;
}

message AggSlotProto {
  AggKindProto agg_kind = 1;
  optional string symbol = 2;
  repeated bytes args = 3;
  bool distinct = 4;
  // Populated when agg_kind == AGG_UDAF.
  string udaf_name = 5;
  optional PhysicalNavKindProto arg_physical_nav = 6;
  uint32 arg_physical_offset = 7;
  bool uses_match_metadata = 8;
}

message CurrentRowSlotProto {
  bytes inner_expr = 1;
}

message MeasureSpecProto {
  string alias = 1;
  bytes outer_expr = 2;
  repeated MeasureSlotProto slots = 3;
}

message StatefulSymbolDefProto {
  bytes outer_expr = 1;
  repeated MeasureSlotProto slots = 2;
}

message SymbolDefProto {
  string name = 1;
  bytes predicate = 2;
  StatefulSymbolDefProto stateful = 3;
}

message SubsetDefProto {
  string name = 1;
  repeated string members = 2;
}

message OrderBySpecProto {
  bytes expr = 1;
  bool asc = 2;
  bool nulls_first = 3;
}

message MatchRecognizeLogicalNodeProto {
  repeated bytes partition_by = 1;
  repeated OrderBySpecProto order_by = 2;
  repeated MeasureSpecProto measures = 3;
  RowsPerMatchProto rows_per_match = 4;
  AfterMatchSkipProto after_match_skip = 5;
  PatternProto pattern = 6;
  repeated SymbolDefProto definitions = 7;
  uint32 max_permute_elements = 8;
  uint32 max_nfa_states = 9;
  uint32 max_active_threads = 10;
  repeated SubsetDefProto subsets = 11;
  repeated string output_projection = 12;
  bool has_output_projection = 13;
}

message MatchRecognizePhysicalNodeProto {
  repeated bytes partition_by = 1;
  repeated OrderBySpecProto order_by = 2;
  repeated MeasureSpecProto measures = 3;
  RowsPerMatchProto rows_per_match = 4;
  AfterMatchSkipProto after_match_skip = 5;
  PatternProto pattern = 6;
  repeated SymbolDefProto definitions = 7;
  uint32 max_permute_elements = 8;
  uint32 max_nfa_states = 9;
  uint32 max_active_threads = 10;
  repeated SubsetDefProto subsets = 11;
  repeated string output_projection = 12;
  bool has_output_projection = 13;
}
