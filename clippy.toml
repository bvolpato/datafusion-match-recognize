disallowed-methods = [
    { path = "tokio::task::spawn", reason = "Use `datafusion_common_runtime::SpawnedTask::spawn` for cancel-safety" },
    { path = "tokio::task::spawn_blocking", reason = "Use `datafusion_common_runtime::SpawnedTask::spawn_blocking` for cancel-safety" },
    { path = "arrow_array::array::AnyDictionaryArray::with_values", reason = "Use `datafusion_common::utils::map_dictionary_values`" },
    { path = "arrow_array::array::DictionaryArray::with_values", reason = "Use `datafusion_common::utils::map_dictionary_values`" },
]

disallowed-types = [
    { path = "tokio::task::JoinSet", reason = "Use `datafusion_common_runtime::JoinSet` to propagate task context" },
    { path = "std::collections::HashMap", reason = "Use `datafusion_common::HashMap` (hashbrown) for better performance" },
    { path = "std::collections::HashSet", reason = "Use `datafusion_common::HashSet` (hashbrown) for better performance" },
    { path = "std::time::Instant", reason = "Use `datafusion_common::instant::Instant` for WASM compatibility" },
]

# Match Apache DataFusion thresholds (prevents large futures and error stack footprints).
future-size-threshold = 10000
large-error-threshold = 70
ignore-interior-mutability = ["bytes::Bytes", "datafusion_common::DFSchema"]
