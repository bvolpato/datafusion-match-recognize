# SPDX-License-Identifier: Apache-2.0

[package]
name = "datafusion-match-recognize"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
readme = "README.md"
description = "SQL:2016 MATCH_RECOGNIZE (Row Pattern Recognition) extension for Apache DataFusion"
homepage = "https://github.com/bvolpato/datafusion-match-recognize"
repository = "https://github.com/bvolpato/datafusion-match-recognize"
keywords = ["datafusion", "sql", "match_recognize", "pattern-matching", "arrow"]
categories = ["database"]

[features]
default = ["proto"]
proto = ["dep:datafusion-proto", "dep:prost", "dep:prost-build"]

[dependencies]
arrow = { version = "60.1.0", features = ["prettyprint", "chrono-tz"] }
arrow-schema = "60.1.0"
async-trait = "0.1.89"
datafusion = { path = "../datafusion/datafusion/core" }
datafusion-common = { path = "../datafusion/datafusion/common" }
datafusion-expr = { path = "../datafusion/datafusion/expr", features = ["sql"] }
datafusion-physical-expr = { path = "../datafusion/datafusion/physical-expr" }
datafusion-physical-plan = { path = "../datafusion/datafusion/physical-plan" }
datafusion-proto = { path = "../datafusion/datafusion/proto", optional = true }
datafusion-sql = { path = "../datafusion/datafusion/sql" }
futures = "0.3"
prost = { version = "0.14.1", optional = true }
sqlparser = { version = "0.63.0", default-features = false, features = ["std", "visitor"] }

[build-dependencies]
prost-build = { version = "0.14.6", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "charset", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqllogictest = "0.29.1"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "funnel_bench"
harness = false

# Lints aligned with Apache DataFusion and datafusion-distributed.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

allow_attributes = "warn"
as_ptr_cast_mut = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
coerce_container_to_any = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
disallowed_methods = "deny"
disallowed_types = "deny"
doc_include_without_cfg = "warn"
empty_enum_variants_with_brackets = "warn"
equatable_if_let = "warn"
exit = "warn"
fn_to_numeric_cast_any = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
large_include_file = "warn"
large_stack_frames = "warn"
literal_string_with_formatting_args = "warn"
mem_forget = "warn"
needless_type_cast = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
set_contains_or_insert = "warn"
single_option_map = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

# Same pedantic opt-outs used in Apache DataFusion's workspace Cargo.toml.
assert_is_empty = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
enum_glob_use = "allow"
explicit_into_iter_loop = "allow"
explicit_iter_loop = "allow"
float_cmp = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
implicit_hasher = "allow"
inline_always = "allow"
items_after_statements = "allow"
manual_string_new = "allow"
many_single_char_names = "allow"
map_unwrap_or = "allow"
match_bool = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_errors_doc = "allow"
missing_fields_in_debug = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_raw_string_hashes = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_literal_bound = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unreadable_literal = "allow"
unused_self = "allow"
used_underscore_items = "allow"
wildcard_imports = "allow"

[lints.rust]
unused_qualifications = "deny"

# Match Apache DataFusion compilation profiles (avoids oversized debug info on macOS/CI).
[profile.dev]
debug = "line-tables-only"

[profile.ci]
inherits = "dev"
debug = false
incremental = false
